<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Зарплата</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <header id="top"></header>
  <main id="view"><div class="loading"><div class="spinner"></div>Загружаю…</div></main>
  <nav id="tabs">
    <button data-view="home" class="active"><span class="ic">🏠</span>Главная</button>
    <button data-view="calendar"><span class="ic">📅</span>Календарь</button>
    <button data-view="stats"><span class="ic">📊</span>Статистика</button>
    <button data-view="payouts"><span class="ic">💸</span>Выплаты</button>
    <button data-view="more"><span class="ic">⚙️</span>Ещё</button>
  </nav>
</div>
<div id="sheet-backdrop" hidden></div>
<section id="sheet" hidden></section>
<div id="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
